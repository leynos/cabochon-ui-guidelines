<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Control gallery</title>
  <desc id="desc">Buttons, fields, checkboxes, radio buttons, a slider, tabs and target-size examples.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Controls are direct</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A control looks like what it does. It has one job, one label and a target a hand can find.</text><text x="64" y="158" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">BUTTONS</text><rect x="64" y="174" width="124" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="126.0" y="194.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Cancel</text><rect x="200" y="170" width="140" height="36" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="270.0" y="192.0" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Save note</text><rect x="352" y="174" width="132" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="418.0" y="194.0" fill="#8A302F" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Delete</text><rect x="496" y="174" width="124" height="32" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="558.0" y="194.0" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Unavailable</text><text x="64" y="254" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">FIELDS</text><text x="64" y="272" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Title</text><rect x="64" y="278" width="300" height="32" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="74" y="298.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">North Sea transition</text><text x="64" y="336" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Provider</text><rect x="64" y="342" width="300" height="32" fill="#FFFFFF" stroke="#8A302F" stroke-width="2" rx="0"/><text x="74" y="362.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">enfilade.table</text><text x="64" y="404" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">The provider is chosen by the object, not typed by the user.</text><text x="64" y="458" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">CHOICE</text><rect x="64" y="471" width="16" height="16" fill="#FFFFFF" stroke="#17201C" stroke-width="1" rx="0"/><path d="M 67 480 L 71 484 L 78 475" fill="none" stroke="#285E50" stroke-width="2.5"/><text x="88" y="484" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Show grid</text><rect x="64" y="499" width="16" height="16" fill="#FFFFFF" stroke="#17201C" stroke-width="1" rx="0"/><path d="M 67 508 L 71 512 L 78 503" fill="none" stroke="#285E50" stroke-width="2.5"/><text x="88" y="512" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Snap to guides</text><rect x="64" y="527" width="16" height="16" fill="#FFFFFF" stroke="#17201C" stroke-width="1" rx="0"/><text x="88" y="540" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Show rulers</text><circle cx="268" cy="479" r="8" fill="#FFFFFF" stroke="#17201C" stroke-width="1"/><circle cx="268" cy="479" r="4" fill="#285E50" stroke-width="1"/><text x="284" y="484" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Current value</text><circle cx="268" cy="507" r="8" fill="#FFFFFF" stroke="#17201C" stroke-width="1"/><text x="284" y="512" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Last saved value</text><circle cx="268" cy="535" r="8" fill="#FFFFFF" stroke="#17201C" stroke-width="1"/><text x="284" y="540" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Both, side by side</text><text x="500" y="458" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">RANGE AND TABS</text><text x="500" y="484" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Stroke</text><line x1="560" y1="494" x2="780" y2="494" stroke="#AAA99F" stroke-width="4"/><line x1="560" y1="494" x2="668" y2="494" stroke="#285E50" stroke-width="4"/><circle cx="668" cy="494" r="8" fill="#FAF8F2" stroke="#285E50" stroke-width="2"/><text x="796" y="498" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">2 px</text><rect x="500" y="526" width="100" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="550" y="547" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" font-style="normal">Note</text><line x1="500" y1="557" x2="600" y2="557" stroke="#8A302F" stroke-width="3"/><rect x="600" y="526" width="100" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="650" y="547" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" font-style="normal">Table</text><rect x="700" y="526" width="100" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="750" y="547" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" font-style="normal">Diagram</text><text x="500" y="586" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A slider shows its value and its unit. A tab names a view,</text><text x="500" y="603" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">never a verb. A checkbox is a state; a button is an action.</text><line x1="64" y1="600" x2="1136" y2="600" stroke="#AAA99F" stroke-width="1"/><text x="64" y="630" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">TARGETS AND SPACING</text><rect x="64" y="650" width="28" height="28" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="108" y="646" width="36" height="36" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="160" y="650" width="28" height="28" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><line x1="196" y1="664" x2="220" y2="664" stroke="#8A302F" stroke-width="1" stroke-dasharray="3 3"/><text x="230" y="668" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">8 px between targets</text><text x="64" y="712" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">28 minimum · 32 preferred · 36 primary</text><text x="440" y="640" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Labels sit above fields and beside choices. Units and shortcuts use the metadata voice. A control that needs a paragraph</text><text x="440" y="657" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">of explanation needs a different control.</text>
</svg>

