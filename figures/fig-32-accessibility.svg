<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Accessibility tree and focus order</title>
  <desc id="desc">A document window with numbered focus order and an accessibility tree listing roles and names, plus target-size and contrast rules.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">The accessibility tree is another output</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Names, roles, states and order come from the same scene that draws the pixels. They are not reconstructed afterwards.</text><rect x="72" y="168" width="560" height="480" fill="#17201C20" stroke-width="1" rx="0"/><rect x="64" y="160" width="560" height="480" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="160" width="560" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="190.5" x2="624" y2="190.5" stroke="#AAA99F" stroke-width="1"/><text x="76" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Facet Notes — North Sea transition</text><rect x="554" y="169" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="560" y="179" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">–</text><rect x="576" y="169" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="582" y="179" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">□</text><rect x="598" y="169" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="604" y="179" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">×</text><rect x="64" y="191" width="560" height="29" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="219.5" x2="624" y2="219.5" stroke="#AAA99F" stroke-width="1"/><text x="79" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">File</text><text x="127" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Edit</text><text x="175" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">View</text><text x="223" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Object</text><text x="285" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Tools</text><text x="340" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Window</text><text x="402" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Help</text><line x1="64" y1="220" x2="624" y2="220" stroke="#AAA99F" stroke-width="1"/><rect x="64" y="614" width="560" height="26" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="614.5" x2="624" y2="614.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="631" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">North Sea transition · 1 embed selected</text><rect x="64" y="220" width="180" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="247.5" x2="244" y2="247.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="238" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">NOTES</text><rect x="244" y="220" width="380" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="244" y1="247.5" x2="624" y2="247.5" stroke="#AAA99F" stroke-width="1"/><text x="254" y="238" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">DOCUMENT</text><text x="78" y="264" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Project</text><text x="78" y="292" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">North Sea transition</text><text x="78" y="320" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Sources</text><text x="78" y="348" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Figures</text><text x="266" y="272" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="18" font-weight="normal" text-anchor="start" font-style="italic">North Sea transition</text><text x="266" y="300" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A note with one selected embed and a visible focus ring.</text><rect x="266" y="354" width="336" height="72" fill="#FAF8F2" stroke="#8A302F" stroke-width="3" rx="0"/><text x="282" y="382" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Generation mix</text><text x="282" y="400" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Table · 12 rows</text><circle cx="84" cy="256" r="10" fill="#285E50" stroke-width="1"/><text x="84" y="259.5" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="middle" font-style="normal">1</text><circle cx="564" cy="272" r="10" fill="#285E50" stroke-width="1"/><text x="564" y="275.5" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="middle" font-style="normal">2</text><circle cx="584" cy="366" r="10" fill="#285E50" stroke-width="1"/><text x="584" y="369.5" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="middle" font-style="normal">3</text><circle cx="564" cy="628" r="10" fill="#285E50" stroke-width="1"/><text x="564" y="631.5" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="middle" font-style="normal">4</text><text x="680" y="190" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">ACCESSIBILITY TREE</text><text x="680" y="220" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">window</text><text x="830" y="220" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Facet Notes — North Sea transition</text><line x1="680" y1="228" x2="1136" y2="228" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="250" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">  menu bar</text><text x="830" y="250" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">File, Edit, View, Object, Tools, Window, Help</text><line x1="680" y1="258" x2="1136" y2="258" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="280" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">  tree</text><text x="830" y="280" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Notes, 7 items</text><line x1="680" y1="288" x2="1136" y2="288" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="310" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">    tree item</text><text x="830" y="310" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">North Sea transition, selected</text><line x1="680" y1="318" x2="1136" y2="318" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="340" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">  document</text><text x="830" y="340" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">North Sea transition</text><line x1="680" y1="348" x2="1136" y2="348" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="370" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">    group</text><text x="830" y="370" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Generation mix, table, 12 rows</text><line x1="680" y1="378" x2="1136" y2="378" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="400" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">      button</text><text x="830" y="400" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Open source</text><line x1="680" y1="408" x2="1136" y2="408" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="430" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">  status</text><text x="830" y="430" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">North Sea transition, 1 embed selected</text><line x1="680" y1="438" x2="1136" y2="438" stroke="#AAA99F" stroke-width="0.5"/><text x="680" y="490" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">TARGETS AND CONTRAST</text><rect x="680" y="510" width="28" height="28" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="732" y="506" width="36" height="36" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="784" y="530" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">28 minimum · 36 primary</text><text x="680" y="566" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Text meets 4.5:1 at body size and 3:1 at large size. Focus is visible at 3:1</text><text x="680" y="583" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">against both the control and its surround. State is never carried by colour</text><text x="680" y="600" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">alone.</text><text x="680" y="650" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The same tree drives screen readers, keyboard traversal and automated checks.</text><text x="680" y="667" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">If a name is missing from the scene, it is missing from every target.</text>
</svg>

