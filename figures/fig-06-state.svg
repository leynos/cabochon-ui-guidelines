<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" data-figure-class="schematic" data-figure-profile="semantic" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-06-state&quot;, &quot;profile&quot;: &quot;semantic&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">Five live-relationship states and their legal transitions</title>
  <desc id="desc">Cards for current, refreshing, stale, broken and denied, followed by the legal transition table with owners.</desc>
  <rect width="1200" height="740" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Failure has a shape</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Five visible states, one vocabulary. A spinner is not a state description.</text><g data-mark="dot"><rect x="64" y="166" width="204" height="190" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="86" cy="194" r="3" fill="#285E50" stroke-width="1"/><text x="102" y="200" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6" data-state="Current">CURRENT</text><text x="82" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The last read succeeded.</text><line x1="82" y1="300" x2="250" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="82" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Use the value.</text></g><g data-mark="arc"><rect x="284" y="166" width="204" height="190" fill="#FAF8F2" stroke="#456A62" stroke-width="1" rx="0"/><path d="M 308.60 192.60 A 2.9 2.9 0 1 0 308.70 195.20" fill="none" stroke="#456A62" stroke-width="1.5"/><path d="M 309.40 191.40 L 308.60 192.60 L 307.40 192.20" fill="none" stroke="#456A62" stroke-width="1.3"/><text x="322" y="200" fill="#456A62" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6" data-state="Refreshing">REFRESHING</text><text x="302" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A refresh is in flight.</text><line x1="302" y1="300" x2="470" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="302" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Keep the old value.</text></g><g data-mark="triangle"><rect x="504" y="166" width="204" height="190" fill="#FAF8F2" stroke="#8A5B24" stroke-width="2" rx="0"/><path d="M 526.00 190.60 L 529.40 196.80 L 522.60 196.80 Z" fill="#8A5B24" stroke-width="1"/><text x="542" y="200" fill="#8A5B24" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6" data-state="Stale">STALE</text><text x="522" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The source changed or is</text><text x="522" y="242" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">late.</text><line x1="522" y1="300" x2="690" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="522" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Keep and label it.</text></g><g data-mark="broken"><rect x="724" y="166" width="204" height="190" fill="#FAF8F2" stroke="#8A302F" stroke-width="1" rx="0"/><line x1="742.6" y1="194" x2="744.7" y2="194" stroke="#8A302F" stroke-width="1.8"/><line x1="747.3" y1="194" x2="749.4" y2="194" stroke="#8A302F" stroke-width="1.8"/><line x1="743.2" y1="191.6" x2="744.2" y2="192.8" stroke="#8A302F" stroke-width="1"/><line x1="748.8" y1="196.4" x2="747.8" y2="195.2" stroke="#8A302F" stroke-width="1"/><text x="762" y="200" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6" data-state="Broken">BROKEN</text><text x="742" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The relationship cannot</text><text x="742" y="242" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">resolve.</text><line x1="742" y1="300" x2="910" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="742" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Keep the link.</text></g><g data-mark="lock"><rect x="944" y="166" width="204" height="190" fill="#FAF8F2" stroke="#8A302F" stroke-width="2" rx="0"/><path d="M 964.20 193.40 L 964.20 192.20 A 1.8 1.8 0 0 1 967.80 192.20 L 967.80 193.40" fill="none" stroke="#8A302F" stroke-width="1.2"/><rect x="963.2" y="193.4" width="5.6" height="4.2" fill="#8A302F" stroke-width="1" rx="0.6"/><text x="982" y="200" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6" data-state="Denied">DENIED</text><text x="962" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Authority was refused.</text><line x1="962" y1="300" x2="1130" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="962" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Explain the grant.</text></g><text x="64" y="400" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">LEGAL TRANSITIONS</text><text x="80" y="430" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">FROM</text><text x="250" y="430" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">EVENT</text><text x="760" y="430" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">TO</text><text x="900" y="430" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">OWNER</text><line x1="64" y1="442" x2="1136" y2="442" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="460" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Current</text><text x="250" y="460" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A newer revision is reported</text><text x="760" y="460" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Stale</text><text x="900" y="460" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Provider</text><line x1="64" y1="470" x2="1136" y2="470" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="488" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Current, Stale</text><text x="250" y="488" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A refresh begins</text><text x="760" y="488" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Refreshing</text><text x="900" y="488" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Application</text><line x1="64" y1="498" x2="1136" y2="498" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="516" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Refreshing</text><text x="250" y="516" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The source value returns</text><text x="760" y="516" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Current</text><text x="900" y="516" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Application</text><line x1="64" y1="526" x2="1136" y2="526" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="544" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Refreshing</text><text x="250" y="544" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The source is unreachable</text><text x="760" y="544" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Broken</text><text x="900" y="544" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Application</text><line x1="64" y1="554" x2="1136" y2="554" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="572" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Refreshing</text><text x="250" y="572" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The read is refused</text><text x="760" y="572" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Denied</text><text x="900" y="572" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Host</text><line x1="64" y1="582" x2="1136" y2="582" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="600" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Broken</text><text x="250" y="600" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A retry begins and the source answers</text><text x="760" y="600" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Refreshing</text><text x="900" y="600" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">User</text><line x1="64" y1="610" x2="1136" y2="610" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="628" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Denied</text><text x="250" y="628" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A capability is granted and a refresh begins</text><text x="760" y="628" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Refreshing</text><text x="900" y="628" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">User or host</text><text x="64" y="700" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">Every refresh logically enters Refreshing. There is no direct Current to Broken or Denied.</text>
</svg>

