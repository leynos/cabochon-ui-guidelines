<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Five live-relationship states</title>
  <desc id="desc">Cards for current, refreshing, stale, broken and denied, with recovery and failure transitions.</desc>
  <rect width="1200" height="700" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Failure has a shape</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Five visible states, one vocabulary. A spinner is not a state description.</text><rect x="64" y="166" width="204" height="190" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="86" cy="194" r="7" fill="#285E50" stroke-width="1"/><text x="102" y="200" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">CURRENT</text><text x="82" y="232" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The</text><text x="82" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">last</text><text x="82" y="264" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">read</text><line x1="82" y1="300" x2="250" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="82" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Use the value.</text><rect x="284" y="166" width="204" height="190" fill="#FAF8F2" stroke="#456A62" stroke-width="1" rx="0"/><circle cx="306" cy="194" r="7" fill="#456A62" stroke-width="1"/><text x="322" y="200" fill="#456A62" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">REFRESHING</text><text x="302" y="232" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A</text><text x="302" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">refresh</text><text x="302" y="264" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">is</text><line x1="302" y1="300" x2="470" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="302" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Keep the old value.</text><rect x="504" y="166" width="204" height="190" fill="#FAF8F2" stroke="#8A5B24" stroke-width="2" rx="0"/><circle cx="526" cy="194" r="7" fill="#8A5B24" stroke-width="1"/><text x="542" y="200" fill="#8A5B24" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">STALE</text><text x="522" y="232" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The</text><text x="522" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">source</text><text x="522" y="264" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">changed</text><line x1="522" y1="300" x2="690" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="522" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Keep and label it.</text><rect x="724" y="166" width="204" height="190" fill="#FAF8F2" stroke="#8A302F" stroke-width="1" rx="0"/><circle cx="746" cy="194" r="7" fill="#8A302F" stroke-width="1"/><text x="762" y="200" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">BROKEN</text><text x="742" y="232" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The</text><text x="742" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">relationship</text><text x="742" y="264" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">cannot</text><line x1="742" y1="300" x2="910" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="742" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Keep the link.</text><rect x="944" y="166" width="204" height="190" fill="#FAF8F2" stroke="#8A302F" stroke-width="2" rx="0"/><circle cx="966" cy="194" r="7" fill="#8A302F" stroke-width="1"/><text x="982" y="200" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">DENIED</text><text x="962" y="232" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Authority</text><text x="962" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">was</text><text x="962" y="264" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">refused.</text><line x1="962" y1="300" x2="1130" y2="300" stroke="#AAA99F" stroke-width="1"/><text x="962" y="326" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Explain the grant.</text><line x1="120" y1="470" x2="1080" y2="470" stroke="#AAA99F" stroke-width="2"/><circle cx="150" cy="470" r="7" fill="#FAF8F2" stroke="#17201C" stroke-width="2"/><text x="150" y="500" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal" letter-spacing="0.5">CURRENT</text><circle cx="380" cy="470" r="7" fill="#FAF8F2" stroke="#17201C" stroke-width="2"/><text x="380" y="500" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal" letter-spacing="0.5">REFRESHING</text><circle cx="620" cy="470" r="7" fill="#FAF8F2" stroke="#17201C" stroke-width="2"/><text x="620" y="500" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal" letter-spacing="0.5">STALE</text><circle cx="875" cy="470" r="7" fill="#FAF8F2" stroke="#17201C" stroke-width="2"/><text x="875" y="500" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal" letter-spacing="0.5">BROKEN</text><path d="M 390 458 Q 500 424 610 458" fill="none" stroke="#285E50" stroke-width="2"/><path d="M 630 482 Q 500 516 390 482" fill="none" stroke="#285E50" stroke-width="2"/><text x="500" y="446" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">refresh succeeds</text><text x="500" y="532" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">recovery keeps the last good value</text><line x1="620" y1="462" x2="875" y2="462" stroke="#8A302F" stroke-width="2"/><text x="748" y="454" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">source lost</text><text x="64" y="640" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">Denied is a gate, not a destination: the user can grant authority and return to current.</text>
</svg>

