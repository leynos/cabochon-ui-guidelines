<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-27-hello-window&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">hello-window reference application</title>
  <desc id="desc">A small hello-window application with File, View and Help menus, an Export button and the complete export bundle, plus the contracts it proves.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">hello-window</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">The smallest application that proves the contract. It is small on purpose, and complete on purpose.</text><rect x="72" y="166" width="470" height="300" fill="#17201C20" stroke-width="1" rx="0"/><rect x="64" y="158" width="470" height="300" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="158" width="470" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="188.5" x2="534" y2="188.5" stroke="#AAA99F" stroke-width="1"/><text x="76" y="178" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">hello-window</text><text x="444" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">–</text><text x="480" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">□</text><text x="516" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">×</text><rect x="64" y="189" width="470" height="29" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="217.5" x2="534" y2="217.5" stroke="#AAA99F" stroke-width="1"/><text x="79" y="208" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">File</text><text x="127" y="208" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">View</text><text x="175" y="208" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Help</text><line x1="64" y1="218" x2="534" y2="218" stroke="#AAA99F" stroke-width="1"/><rect x="64" y="432" width="470" height="26" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="432.5" x2="534" y2="432.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="449" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">1 document · exported 14:02</text><g data-mark="dot"><rect x="414" y="433" width="65.74000000000001" height="20" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="424" cy="443" r="3" fill="#285E50" stroke-width="1"/><text x="432" y="447" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" data-state="Current">CURRENT</text></g><text x="92" y="266" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="normal" text-anchor="start" font-style="italic">Hello, Cabochon.</text><text x="92" y="296" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">One window, three menus, one document and one command. Everything the</text><text x="92" y="312" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">environment requires is present, and nothing else is.</text><rect x="92" y="364" width="122" height="34" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="153.0" y="385.0" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Export</text><rect x="226" y="364" width="112" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="282.0" y="385.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">About</text><text x="92" y="420" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Ctrl+Q quits · F1 opens About</text><text x="590" y="190" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">EXPORT BUNDLE</text><rect x="590" y="214" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="602" y="235" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">content.pdf</text><text x="828" y="235" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><rect x="860" y="214" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="872" y="235" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">content-print.pdf</text><text x="1098" y="235" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><rect x="590" y="258" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="602" y="279" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">content.png</text><text x="828" y="279" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><rect x="860" y="258" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="872" y="279" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">thumbnail.png</text><text x="1098" y="279" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><rect x="590" y="302" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="602" y="323" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">accessibility.json</text><text x="828" y="323" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><rect x="860" y="302" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="872" y="323" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">clipboard/</text><text x="1098" y="323" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><rect x="590" y="346" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="602" y="367" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">hit-map.json</text><text x="828" y="367" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><rect x="860" y="346" width="250" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="872" y="367" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">export.json</text><text x="1098" y="367" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">✓</text><text x="590" y="420" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Each artefact comes from the same Lapidary scene. Geometry, text placement, clipping and</text><text x="590" y="437" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">metadata agree within the declared tolerances, and the accessibility and hit-map outputs</text><text x="590" y="454" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">describe the same objects that were drawn.</text><text x="590" y="520" fill="#8A302F" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="12" font-weight="normal" text-anchor="start" font-style="italic">The reference application is not a demo.</text><line x1="64" y1="560" x2="1136" y2="560" stroke="#AAA99F" stroke-width="1"/><text x="64" y="592" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">WHAT IT PROVES</text><text x="64" y="622" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">RESOURCES</text><text x="64" y="644" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Menus, strings and shortcuts load</text><text x="64" y="659" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">from Escutcheon.</text><text x="280" y="622" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">SCENE</text><text x="280" y="644" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">One Lapidary scene renders every</text><text x="280" y="659" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">target.</text><text x="496" y="622" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">OUTPUT</text><text x="496" y="644" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Burin writes display, PDF, raster</text><text x="496" y="659" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">and metadata.</text><text x="712" y="622" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">ACCESS</text><text x="712" y="644" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Roles, names and focus order are</text><text x="712" y="659" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">extractable.</text><text x="928" y="622" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">LOCALE</text><text x="928" y="644" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">en-XA and ar-XB run without layout</text><text x="928" y="659" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">breaks.</text>
