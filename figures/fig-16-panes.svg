<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-16-panes&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">Pane layout with minimum widths and splitters</title>
  <desc id="desc">Navigator, document and inspector panes with minimum widths, a splitter detail and a collapsed pane.</desc>
  <rect width="1200" height="800" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Panes that keep their promises</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A pane has a name, a minimum width and a remembered position. It never disappears without leaving a handle.</text><rect x="64" y="170" width="210" height="360" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="170" width="210" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="197.5" x2="274" y2="197.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="188" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">NAVIGATOR</text><text x="78" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Project tree, saved views and</text><text x="78" y="242" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">recent objects.</text><rect x="274" y="170" width="6" height="360" fill="#AAA99F" stroke="#17201C" stroke-width="1" rx="0"/><rect x="280" y="170" width="632" height="360" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="280" y="170" width="632" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="280" y1="197.5" x2="912" y2="197.5" stroke="#AAA99F" stroke-width="1"/><text x="290" y="188" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">DOCUMENT</text><text x="302" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The document takes the remaining width. It is the only pane that may grow without limit.</text><rect x="912" y="170" width="240" height="360" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><rect x="912" y="170" width="240" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="912" y1="197.5" x2="1152" y2="197.5" stroke="#AAA99F" stroke-width="1"/><text x="922" y="188" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">INSPECTOR</text><text x="926" y="226" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Identity, presentation, state and</text><text x="926" y="242" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">capabilities for the selection.</text><text x="169" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">210 min</text><text x="596" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">flexible · ≥ 420</text><text x="1032" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">240 min</text><line x1="64" y1="538" x2="274" y2="538" stroke="#AAA99F" stroke-width="1"/><line x1="280" y1="538" x2="912" y2="538" stroke="#AAA99F" stroke-width="1"/><line x1="912" y1="538" x2="1152" y2="538" stroke="#AAA99F" stroke-width="1"/><text x="64" y="596" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">SPLITTER</text><rect x="64" y="620" width="6" height="80" fill="#AAA99F" stroke="#17201C" stroke-width="1" rx="0"/><line x1="70" y1="620" x2="250" y2="620" stroke="#AAA99F" stroke-width="1" stroke-dasharray="2 4"/><line x1="70" y1="700" x2="250" y2="700" stroke="#AAA99F" stroke-width="1" stroke-dasharray="2 4"/><text x="270" y="640" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">6 px visible rule, 8 px hit area</text><text x="270" y="662" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Double-click restores the default</text><text x="270" y="684" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Drag is immediate; no preview pane</text><text x="620" y="596" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">COLLAPSED</text><rect x="620" y="620" width="42" height="120" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="641" y="660" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">Inspector</text><path d="M 632 740 L 650 740 M 641 732 L 641 748" fill="none" stroke="#17201C" stroke-width="1.5"/><text x="680" y="646" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A collapsed pane keeps its head and handle.</text><text x="680" y="668" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Its state is remembered per project.</text><text x="680" y="690" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">It never reopens at a new width.</text><text x="64" y="744" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Two panes beside a document is the practical limit. A third pane becomes a tab or a separate window. Nested splitters are allowed only when each level keeps a named head.</text>
</svg>

