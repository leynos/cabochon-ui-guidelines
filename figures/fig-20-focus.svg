<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-20-focus&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">Focus ring, tab order and keyboard map</title>
  <desc id="desc">A focus ring measured at three pixels with a three pixel offset, a tab order for a document window, and the essential keyboard commands.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Focus is a place you can see</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">The keyboard reaches everything. The focus ring is never removed to make a screenshot look calmer.</text><text x="64" y="158" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">FOCUS RING</text><rect x="64" y="180" width="260" height="150" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="96" y="222" width="150" height="32" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="171.0" y="242.0" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Open source</text><rect x="93" y="219" width="156" height="38" fill="none" stroke="#8A302F" stroke-width="3" rx="0"/><line x1="252" y1="200" x2="286" y2="200" stroke="#8A302F" stroke-width="1"/><text x="292" y="204" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">3 px oxide</text><line x1="252" y1="238" x2="286" y2="238" stroke="#8A302F" stroke-width="1"/><text x="292" y="242" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">3 px offset</text><text x="64" y="360" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Only the focused control carries the ring.</text><text x="420" y="158" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">TAB ORDER</text><circle cx="434" cy="176" r="10" fill="#285E50" stroke-width="1"/><text x="434" y="180" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="middle" font-style="normal">1</text><text x="458" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Navigator tree</text><line x1="434" y1="188" x2="434" y2="200" stroke="#AAA99F" stroke-width="1"/><circle cx="434" cy="208" r="10" fill="#285E50" stroke-width="1"/><text x="434" y="212" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="middle" font-style="normal">2</text><text x="458" y="212" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Splitter after the navigator</text><line x1="434" y1="220" x2="434" y2="232" stroke="#AAA99F" stroke-width="1"/><circle cx="434" cy="240" r="10" fill="#285E50" stroke-width="1"/><text x="434" y="244" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="middle" font-style="normal">3</text><text x="458" y="244" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Document body</text><line x1="434" y1="252" x2="434" y2="264" stroke="#AAA99F" stroke-width="1"/><circle cx="434" cy="272" r="10" fill="#285E50" stroke-width="1"/><text x="434" y="276" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="middle" font-style="normal">4</text><text x="458" y="276" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">First embed or object</text><line x1="434" y1="284" x2="434" y2="296" stroke="#AAA99F" stroke-width="1"/><circle cx="434" cy="304" r="10" fill="#285E50" stroke-width="1"/><text x="434" y="308" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="middle" font-style="normal">5</text><text x="458" y="308" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Splitter before the inspector</text><line x1="434" y1="316" x2="434" y2="328" stroke="#AAA99F" stroke-width="1"/><circle cx="434" cy="336" r="10" fill="#285E50" stroke-width="1"/><text x="434" y="340" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="middle" font-style="normal">6</text><text x="458" y="340" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Inspector fields</text><line x1="434" y1="348" x2="434" y2="360" stroke="#AAA99F" stroke-width="1"/><circle cx="434" cy="368" r="10" fill="#285E50" stroke-width="1"/><text x="434" y="372" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="middle" font-style="normal">7</text><text x="458" y="372" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Status line actions</text><text x="64" y="430" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">KEYS THAT MUST WORK</text><text x="64" y="462" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Tab / Shift+Tab</text><text x="300" y="462" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">move between groups and controls</text><line x1="64" y1="470" x2="740" y2="470" stroke="#AAA99F" stroke-width="0.5"/><text x="64" y="490" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Arrow keys</text><text x="300" y="490" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">move within a tree, list or grid</text><line x1="64" y1="498" x2="740" y2="498" stroke="#AAA99F" stroke-width="0.5"/><text x="64" y="518" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Enter</text><text x="300" y="518" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">activate the focused control</text><line x1="64" y1="526" x2="740" y2="526" stroke="#AAA99F" stroke-width="0.5"/><text x="64" y="546" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Space</text><text x="300" y="546" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">toggle a checkbox or press a button</text><line x1="64" y1="554" x2="740" y2="554" stroke="#AAA99F" stroke-width="0.5"/><text x="64" y="574" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Esc</text><text x="300" y="574" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">dismiss a menu, popover or dialog</text><line x1="64" y1="582" x2="740" y2="582" stroke="#AAA99F" stroke-width="0.5"/><text x="64" y="602" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">F6</text><text x="300" y="602" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">cycle panes</text><line x1="64" y1="610" x2="740" y2="610" stroke="#AAA99F" stroke-width="0.5"/><text x="64" y="630" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">F1</text><text x="300" y="630" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">open help for the focused object</text><line x1="64" y1="638" x2="740" y2="638" stroke="#AAA99F" stroke-width="0.5"/><text x="64" y="658" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">Ctrl+Q</text><text x="300" y="658" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">quit the application</text><line x1="64" y1="666" x2="740" y2="666" stroke="#AAA99F" stroke-width="0.5"/><text x="780" y="186" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Focus moves in reading order. A composite control is one stop;</text><text x="780" y="204" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">arrows move inside it. The ring is drawn outside the control</text><text x="780" y="222" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">so it never changes the layout.</text><text x="780" y="300" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Shortcuts are labels, not secrets. Every shortcut appears</text><text x="780" y="318" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">beside its command in a menu and is searchable in the command</text><text x="780" y="336" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">palette.</text><text x="780" y="414" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A window that loses focus keeps a muted focus memory. When it</text><text x="780" y="432" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">returns, the last focused control receives the ring again.</text><text x="780" y="540" fill="#8A302F" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="12" font-weight="normal" text-anchor="start" font-style="italic">Never trap focus except in a modal dialog.</text>
</svg>

