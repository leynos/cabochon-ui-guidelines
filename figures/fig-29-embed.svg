<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-figure-class="schematic" data-figure-profile="semantic" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-29-embed&quot;, &quot;profile&quot;: &quot;semantic&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">Embed envelope and provider</title>
  <desc id="desc">A document embed pointing to a provider-owned object, with the five failure states listed below.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">An embed is a promise</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">The document owns a presentation. The object keeps its identity, its provider and its state.</text><rect x="64" y="180" width="340" height="380" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="180" width="340" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="207.5" x2="404" y2="207.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="198" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">DOCUMENT</text><text x="82" y="234" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="16" font-weight="normal" text-anchor="start" font-style="italic">North Sea transition</text><text x="82" y="262" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The note contains a table. The table is not copied</text><text x="82" y="278" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">into the note file.</text><rect x="82" y="330" width="304" height="120" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="96" y="356" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Generation mix</text><text x="96" y="374" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Table · 12 rows</text><g data-mark="dot"><rect x="282" y="346" width="65.74000000000001" height="20" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="292" cy="356" r="3" fill="#285E50" stroke-width="1"/><text x="300" y="360" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" data-state="Current">CURRENT</text></g><line x1="96" y1="390" x2="372" y2="390" stroke="#AAA99F" stroke-width="0.5"/><line x1="96" y1="406" x2="372" y2="406" stroke="#AAA99F" stroke-width="0.5"/><line x1="96" y1="422" x2="372" y2="422" stroke="#AAA99F" stroke-width="0.5"/><text x="82" y="496" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">EMBED ENVELOPE</text><text x="82" y="520" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">obj:8f3a · r17 · table</text><text x="82" y="540" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">presentation: in-note</text><line x1="434" y1="330" x2="564" y2="330" stroke="#17201C" stroke-width="2"/><path d="M 556 322 L 568 330 L 556 338" fill="none" stroke="#17201C" stroke-width="2"/><text x="440" y="320" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">resolve</text><rect x="594" y="180" width="340" height="240" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><rect x="594" y="180" width="340" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="594" y1="207.5" x2="934" y2="207.5" stroke="#AAA99F" stroke-width="1"/><text x="604" y="198" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">PROVIDER</text><text x="612" y="234" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="13" font-weight="bold" text-anchor="start" font-style="normal">enfilade.table</text><text x="612" y="254" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">owns payload · revisions · grants</text><text x="612" y="286" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.5">OBJECT</text><text x="916" y="286" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">obj:8f3a</text><line x1="612" y1="294" x2="916" y2="294" stroke="#AAA99F" stroke-width="0.5"/><text x="612" y="310" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.5">REVISION</text><text x="916" y="310" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">r17</text><line x1="612" y1="318" x2="916" y2="318" stroke="#AAA99F" stroke-width="0.5"/><text x="612" y="334" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.5">STATE</text><text x="916" y="334" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">current</text><line x1="612" y1="342" x2="916" y2="342" stroke="#AAA99F" stroke-width="0.5"/><text x="612" y="372" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">A second presentation reads the same object.</text><text x="64" y="612" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">HOW RESOLUTION ENDS</text><g data-mark="dot"><rect x="64" y="630" width="200" height="58" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="82" cy="652" r="3" fill="#285E50" stroke-width="1"/><text x="96" y="652" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" data-state="Resolved">Resolved</text><text x="76" y="672" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">provider answered</text></g><g data-mark="hatch"><rect x="280" y="630" width="200" height="58" fill="#FAF8F2" stroke="#59625D" stroke-width="1" rx="0"/><rect x="295" y="649" width="6" height="6" fill="none" stroke="#59625D" stroke-width="1" rx="0"/><line x1="295.8" y1="654.2" x2="300.2" y2="649.8" stroke="#59625D" stroke-width="0.9"/><line x1="297.6" y1="654.6" x2="300.6" y2="651.6" stroke="#59625D" stroke-width="0.9"/><line x1="295.4" y1="652.4" x2="298.4" y2="649.4" stroke="#59625D" stroke-width="0.9"/><text x="312" y="652" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" data-state="Opaque">Opaque</text><text x="292" y="672" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">unknown object type</text></g><g data-mark="dashed"><rect x="496" y="630" width="200" height="58" fill="#FAF8F2" stroke="#8A302F" stroke-width="1" rx="0"/><rect x="511" y="649" width="6" height="6" fill="none" stroke="#8A302F" stroke-width="1.2" rx="0" stroke-dasharray="1.6 1.4"/><text x="528" y="652" fill="#8A302F" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" data-state="Unavailable">Unavailable</text><text x="508" y="672" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">provider absent</text></g><g data-mark="crossed"><rect x="712" y="630" width="200" height="58" fill="#FAF8F2" stroke="#8A302F" stroke-width="1" rx="0"/><rect x="727" y="649" width="6" height="6" fill="none" stroke="#8A302F" stroke-width="1" rx="0"/><line x1="728" y1="650" x2="732" y2="654" stroke="#8A302F" stroke-width="1.2"/><line x1="728" y1="654" x2="732" y2="650" stroke="#8A302F" stroke-width="1.2"/><text x="744" y="652" fill="#8A302F" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal" data-state="Malformed">Malformed</text><text x="724" y="672" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">payload unreadable</text></g><text x="944" y="638" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Only a resolved embed carries a live</text><text x="944" y="653" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">state: Current, Refreshing, Stale,</text><text x="944" y="668" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Broken or Denied.</text><text x="64" y="710" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">No state deletes the embed or flattens it into pixels. The last readable value remains visible, with its state and the operation that would restore it.</text>
</svg>

