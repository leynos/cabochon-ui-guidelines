<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Command palette over a document</title>
  <desc id="desc">A command palette with a search field, grouped object and command results, a selected row and keyboard hints.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">The command palette is a second door</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">It finds commands, objects and tools by name. It does not replace the menu bar or the document.</text><rect x="64" y="150" width="1072" height="540" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="64" y="150" width="1072" height="540" fill="#17201C" stroke-width="1" rx="0" opacity="0.14"/><rect x="308" y="188" width="600" height="420" fill="#17201C30" stroke-width="1" rx="0"/><rect x="300" y="180" width="600" height="420" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="318" y="198" width="564" height="40" fill="#FFFFFF" stroke="#8A302F" stroke-width="2" rx="0"/><text x="328" y="222.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">curr</text><text x="872" y="223" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">Esc</text><text x="322" y="258" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">OBJECTS</text><text x="324" y="284" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Currency — GBP · obj:4c21</text><text x="876" y="284" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">note:transition</text><text x="324" y="322" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Currency table — 12 rows</text><text x="876" y="322" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">obj:8f3a</text><text x="322" y="360" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">COMMANDS</text><text x="324" y="386" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Insert currency object</text><text x="876" y="386" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+Shift+C</text><rect x="312" y="402" width="576" height="34" fill="#285E50" stroke-width="1" rx="0"/><text x="324" y="424" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Refresh live values</text><text x="876" y="424" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">F5</text><text x="324" y="462" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Open inspector</text><text x="876" y="462" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+I</text><line x1="300" y1="564" x2="900" y2="564" stroke="#AAA99F" stroke-width="1"/><text x="320" y="586" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Enter run   ·   Tab next group   ·   Esc close</text><text x="64" y="726" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Results are grouped by kind. Objects carry identity; commands carry shortcuts; tools appear only when the current selection makes them applicable.</text>
</svg>

