<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-04-principles&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null, &quot;states&quot;: {}}</metadata>
  <title id="title">Four principles</title>
  <desc id="desc">Four cards: rectangles behave, objects persist, output is native, and state speaks.</desc>
  <rect width="1200" height="740" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Four principles</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">They are short enough to remember and specific enough to settle an argument.</text><rect x="64" y="166" width="528" height="240" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="84" y="200" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">01</text><text x="84" y="242" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="normal" text-anchor="start" font-style="italic">Rectangles behave</text><text x="84" y="276" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Compact panes, direct menus and precise geometry. No hamburger archaeology.</text><rect x="438" y="288" width="92" height="56" fill="#F1EEE5" stroke="#285E50" stroke-width="2" rx="0"/><rect x="450" y="300" width="40" height="18" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="496" y="300" width="22" height="18" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="616" y="166" width="528" height="240" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="636" y="200" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">02</text><text x="636" y="242" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="normal" text-anchor="start" font-style="italic">Objects persist</text><text x="636" y="276" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">A note, table or drawing keeps its identity when another tool presents it.</text><ellipse cx="1036" cy="316" rx="40" ry="26" fill="#285E50" stroke="#173F35" stroke-width="1"/><line x1="1036" y1="316" x2="1067.0" y2="262.3064249653648" stroke="#AAA99F" stroke-width="1"/><text x="1070.0" y="261.11027254265815" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">N</text><line x1="1036" y1="316" x2="1097.058080686757" y2="305.23381298465034" stroke="#AAA99F" stroke-width="1"/><text x="1102.9669272048302" y="308.19192391864874" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">T</text><line x1="1036" y1="316" x2="1083.4947554733767" y2="355.8528318005654" stroke="#AAA99F" stroke-width="1"/><text x="1088.0910221320905" y="363.7095574586847" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">D</text><line x1="1036" y1="316" x2="1036.0" y2="378.0" stroke="#AAA99F" stroke-width="1"/><text x="1036.0" y="388.0" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">P</text><rect x="64" y="434" width="528" height="240" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="84" y="468" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">03</text><text x="84" y="510" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="normal" text-anchor="start" font-style="italic">Output is native</text><text x="84" y="544" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">The same scene reaches display, PDF, thumbnail and print without translation.</text><rect x="446" y="550" width="76" height="68" fill="#FFFFFF" stroke="#17201C" stroke-width="1" rx="0"/><text x="484" y="588" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="13" font-weight="bold" text-anchor="middle" font-style="normal">PDF</text><line x1="458" y1="602" x2="510" y2="602" stroke="#AAA99F" stroke-width="1"/><rect x="616" y="434" width="528" height="240" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="636" y="468" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">04</text><text x="636" y="510" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="normal" text-anchor="start" font-style="italic">State speaks</text><text x="636" y="544" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Current, refreshing, stale, broken and denied never hide behind a spinner.</text><rect x="986" y="572" width="32" height="24" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><text x="1002" y="588" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">CUR</text><rect x="1022" y="572" width="32" height="24" fill="#FAF8F2" stroke="#456A62" stroke-width="1" rx="0"/><text x="1038" y="588" fill="#456A62" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">REF</text><rect x="1058" y="572" width="32" height="24" fill="#FAF8F2" stroke="#8A5B24" stroke-width="1" rx="0"/><text x="1074" y="588" fill="#8A5B24" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">STA</text>
</svg>

