<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Formula tool popover over a selected table</title>
  <desc id="desc">A table with selected cells and a formula popover showing the expression, sources, authority, result and state.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">The formula tool at the point of use</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A tool appears beside the selection it can act on. It shows its sources, its authority and its result without taking over the document.</text><rect x="64" y="150" width="760" height="540" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="150" width="760" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="180.5" x2="824" y2="180.5" stroke="#AAA99F" stroke-width="1"/><text x="76" y="170" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Facet Notes — Generation mix</text><rect x="754" y="159" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="760" y="169" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">–</text><rect x="776" y="159" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="782" y="169" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">□</text><rect x="798" y="159" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="804" y="169" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">×</text><text x="92" y="210" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="normal" text-anchor="start" font-style="italic">Generation mix</text><text x="92" y="238" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The table is selected. A compatible tool is offered beside it rather than in a global services menu.</text><rect x="92" y="286" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="242" y="286" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="392" y="286" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="542" y="286" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="92" y="320" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="242" y="320" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="392" y="320" width="150" height="34" fill="#285E50" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="542" y="320" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="92" y="354" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="242" y="354" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="392" y="354" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="542" y="354" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="92" y="388" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="242" y="388" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="392" y="388" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="542" y="388" width="150" height="34" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="242" y="320" width="300" height="34" fill="none" stroke="#8A302F" stroke-width="2" rx="0"/><text x="104" y="310" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Source</text><text x="254" y="310" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Capacity</text><text x="404" y="310" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Output</text><text x="554" y="310" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Share</text><rect x="478" y="348" width="430" height="300" fill="#17201C30" stroke-width="1" rx="0"/><rect x="470" y="340" width="430" height="300" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="488" y="368" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">FORMULA</text><text x="882" y="368" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">Esc</text><rect x="488" y="382" width="394" height="38" fill="#FFFFFF" stroke="#8A302F" stroke-width="2" rx="0"/><text x="500" y="406" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">=SUM(B2:B9) * rate</text><text x="488" y="448" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">SOURCES</text><rect x="488" y="460" width="95.02" height="24" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="499" cy="472" r="3.5" fill="#285E50" stroke-width="1"/><text x="508" y="476" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">TABLE B2:B9</text><rect x="626" y="460" width="88.2" height="24" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="637" cy="472" r="3.5" fill="#285E50" stroke-width="1"/><text x="646" y="476" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">RATE · GBP</text><text x="488" y="512" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.6">AUTHORITY</text><text x="488" y="534" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Read table</text><text x="882" y="534" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">granted</text><text x="488" y="554" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Read rate</text><text x="882" y="554" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">granted</text><line x1="488" y1="572" x2="882" y2="572" stroke="#AAA99F" stroke-width="1"/><text x="488" y="598" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="18" font-weight="bold" text-anchor="start" font-style="normal">1,284.00 GBP</text><rect x="796" y="582" width="67.74000000000001" height="24" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="807" cy="594" r="3.5" fill="#285E50" stroke-width="1"/><text x="816" y="598" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">CURRENT</text><rect x="488" y="608" width="150" height="30" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="563.0" y="627.0" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Insert live value</text><rect x="650" y="608" width="92" height="30" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="696.0" y="627.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Cancel</text><text x="860" y="200" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">RULES</text><text x="860" y="232" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Offer only applicable tools.</text><text x="860" y="260" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Name every source.</text><text x="860" y="288" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Show the grants used.</text><text x="860" y="316" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Keep the last result visible.</text><text x="860" y="344" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Deny instead of inventing.</text><line x1="860" y1="400" x2="1136" y2="400" stroke="#AAA99F" stroke-width="1"/><text x="860" y="426" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The result enters the document as a live value</text><text x="860" y="443" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">with its own identity. It is not a pasted</text><text x="860" y="460" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">number, and it is not a private macro.</text><text x="860" y="520" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">If a source moves or its grant is withdrawn, the</text><text x="860" y="537" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">formula becomes stale or denied. The last</text><text x="860" y="554" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">computed value remains visible and labelled.</text>
</svg>

