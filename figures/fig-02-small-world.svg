<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-02-small-world&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">Four structural choices of the Cabochon character</title>
  <desc id="desc">Cards for compact, document-centred, liberal and practical character, each with a small specimen.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">The Cabochon character</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Four structural choices, not a decoration kit. Each one can be recognised in a window without reading its label.</text><rect x="64" y="166" width="524" height="236" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="84" y="194" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">01</text><text x="84" y="228" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="normal" text-anchor="start" font-style="italic">Compact</text><text x="84" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">rather than cramped</text><line x1="84" y1="262" x2="568" y2="262" stroke="#AAA99F" stroke-width="1"/><text x="84" y="284" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Short rows and generous padding. Density never removes the space a hand or an eye</text><text x="84" y="300" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">needs.</text><rect x="84" y="314" width="220" height="18" fill="#173F35" stroke-width="1" rx="0"/><text x="94" y="327" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">title bar</text><text x="316" y="327" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">31 px</text><rect x="84" y="338" width="220" height="18" fill="#285E50" stroke-width="1" rx="0"/><text x="94" y="351" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">menu bar</text><text x="316" y="351" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">29 px</text><rect x="84" y="362" width="220" height="18" fill="#678E86" stroke-width="1" rx="0"/><text x="94" y="375" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">tree row</text><text x="316" y="375" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">28 px</text><rect x="612" y="166" width="524" height="236" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="632" y="194" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">02</text><text x="632" y="228" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="normal" text-anchor="start" font-style="italic">Document-centred</text><text x="632" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">rather than application-centred</text><line x1="632" y1="262" x2="1116" y2="262" stroke="#AAA99F" stroke-width="1"/><text x="632" y="284" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The document holds the largest plane; the instrument sits at its edges.</text><rect x="632" y="308" width="280" height="60" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="632" y="308" width="42" height="60" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="680" y="314" width="180" height="48" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="866" y="308" width="46" height="60" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="632" y="386" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">rail 126 · document ≥ 420 · inspector 240</text><rect x="64" y="418" width="524" height="236" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="84" y="446" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">03</text><text x="84" y="480" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="normal" text-anchor="start" font-style="italic">Liberal</text><text x="84" y="500" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">rather than paternal</text><line x1="84" y1="514" x2="568" y2="514" stroke="#AAA99F" stroke-width="1"/><text x="84" y="536" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The user owns the work. Export stays available, formats stay open and no account</text><text x="84" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">gates local content.</text><rect x="84" y="568" width="84" height="26" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="96" y="586" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Export</text><rect x="180" y="568" width="120" height="26" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="192" y="586" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Open format</text><rect x="312" y="568" width="116" height="26" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="324" y="586" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">No account</text><text x="84" y="624" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The user owns the work.</text><rect x="612" y="418" width="524" height="236" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="632" y="446" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">04</text><text x="632" y="480" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="normal" text-anchor="start" font-style="italic">Practical</text><text x="632" y="500" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">rather than ornamental</text><line x1="632" y1="514" x2="1116" y2="514" stroke="#AAA99F" stroke-width="1"/><text x="632" y="536" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A rule separates planes, a tint marks a state, a shadow lifts a sheet. Nothing</text><text x="632" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">decorates.</text><rect x="632" y="564" width="40" height="40" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="632" y="622" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">flat fill</text><rect x="752" y="564" width="40" height="40" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="752" y="622" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">1 px keyline</text><rect x="872" y="564" width="40" height="40" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="2"/><text x="872" y="622" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">2 px radius</text><rect x="996" y="568" width="40" height="40" fill="#17201C18" stroke-width="1" rx="0"/><rect x="992" y="564" width="40" height="40" fill="#FAF8F2" stroke-width="1" rx="0"/><text x="992" y="622" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">offset shadow</text><text x="64" y="700" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">A surface that fails any one of these choices is not Cabochon, however closely it copies the palette.</text>
</svg>

