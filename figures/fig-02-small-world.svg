<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">One small world in three rings</title>
  <desc id="desc">Nested frames for contracts, workspace and studio instruments, each containing the first tools.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">One small world, three rings</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">The guidelines begin with the smallest useful environment, not a complete desktop. The same frame, tokens and state vocabulary reach every ring.</text><rect x="150" y="170" width="900" height="500" fill="none" stroke="#AAA99F" stroke-width="1.5" rx="0"/><text x="170" y="198" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">STUDIO INSTRUMENTS</text><rect x="270" y="240" width="660" height="370" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="290" y="268" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">WORKSPACE</text><rect x="390" y="310" width="420" height="230" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="410" y="338" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">CONTRACTS</text><rect x="410" y="360" width="176" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="420" y="382" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">hello-window</text><rect x="600" y="360" width="176" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="610" y="382" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">escutcheon-check</text><rect x="410" y="412" width="176" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="420" y="434" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">Lapidary scene</text><rect x="600" y="412" width="176" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="610" y="434" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">Burin output</text><rect x="292" y="292" width="184" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="302" y="313" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">Facet Notes</text><rect x="490" y="292" width="184" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="500" y="313" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">dataframe</text><rect x="688" y="292" width="184" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="698" y="313" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">diagram</text><rect x="292" y="336" width="184" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="302" y="357" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">bitmap</text><rect x="490" y="336" width="184" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="500" y="357" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">formula</text><rect x="688" y="336" width="184" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="698" y="357" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">inspector</text><rect x="176" y="228" width="250" height="32" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="188" y="249" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Burin Draw</text><rect x="606" y="228" width="250" height="32" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="618" y="249" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Cabochon Press</text><rect x="176" y="272" width="250" height="32" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="188" y="293" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Enfilade Table</text><rect x="606" y="272" width="250" height="32" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="618" y="293" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">command palette</text><line x1="720" y1="660" x2="720" y2="706" stroke="#8A302F" stroke-width="2"/><text x="736" y="704" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">The same rules apply at every ring: identity, state, focus, words and targets.</text>
