<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-15-toolbars&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">Tool strip, status line and target sizes</title>
  <desc id="desc">A drawing tool strip, a status line with a live state, and minimum, preferred and primary target sizes.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Tool strips and status</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Tools sit next to the work. The status line says what the tool will do, what it just did, and what state the data is in.</text><rect x="72" y="168" width="1072" height="76" fill="#17201C18" stroke-width="1" rx="0"/><rect x="64" y="160" width="1072" height="76" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="160" width="1072" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="190.5" x2="1136" y2="190.5" stroke="#AAA99F" stroke-width="1"/><text x="76" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Burin Draw — Currency plate</text><text x="1046" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">–</text><text x="1082" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">□</text><text x="1118" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">×</text><rect x="64" y="191" width="1072" height="30" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="221" x2="1136" y2="221" stroke="#AAA99F" stroke-width="1"/><rect x="76" y="191" width="30" height="30" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><path d="M 86 199 L 94 210 L 90 210 L 92 216 L 88 217 L 86 211 L 83 214 Z" fill="none" stroke="#17201C" stroke-width="1.4"/><rect x="114" y="191" width="30" height="30" fill="#285E50" stroke="#AAA99F" stroke-width="1" rx="0"/><path d="M 123 213 L 125 206 L 134 197 L 138 201 L 129 210 Z" fill="none" stroke="#FFFFFF" stroke-width="1.4"/><rect x="152" y="191" width="30" height="30" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><line x1="160" y1="213" x2="174" y2="199" stroke="#17201C" stroke-width="2"/><rect x="190" y="191" width="30" height="30" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="198" y="201" width="14" height="10" fill="none" stroke="#17201C" stroke-width="1.4" rx="0"/><rect x="228" y="191" width="30" height="30" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><ellipse cx="243" cy="206" rx="8" ry="6" fill="none" stroke="#17201C" stroke-width="1.4"/><rect x="266" y="191" width="30" height="30" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="281" y="211" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" font-style="normal">T</text><line x1="304" y1="197" x2="304" y2="217" stroke="#AAA99F" stroke-width="1"/><text x="312" y="210" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Stroke  1 px</text><text x="464" y="210" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Grid  16 px</text><text x="584" y="210" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Zoom  100%</text><text x="1122" y="210" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Inspector</text><rect x="64" y="300" width="1072" height="26" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="78" y="317" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Pen · dragging a 2 px stroke · 14 objects selected</text><g data-mark="dot"><rect x="1006" y="303" width="65.74000000000001" height="20" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="1016" cy="313" r="3" fill="#285E50" stroke-width="1"/><text x="1024" y="317" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" data-state="Current">CURRENT</text></g><text x="986" y="317" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Saved 14:02</text><text x="64" y="404" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">TARGET SIZES</text><rect x="64" y="430" width="28" height="28" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="78.0" y="448.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" font-style="normal">Aa</text><text x="64" y="488" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">28 × 28  minimum</text><rect x="284" y="430" width="32" height="32" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="300.0" y="450.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" font-style="normal">Aa</text><text x="284" y="488" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">32 × 32  preferred</text><rect x="504" y="430" width="36" height="36" fill="#173F35" stroke="#17201C" stroke-width="1" rx="0"/><text x="522.0" y="452.0" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" font-style="normal">Aa</text><text x="504" y="488" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">36 × 36  primary action</text><text x="64" y="540" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The glyph may be 16 px. The target is never smaller than 28 px, and a primary action in</text><text x="64" y="557" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">a dialog is 36 px high.</text><text x="64" y="610" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Tool strips contain tools, not commands. Save, print and preferences belong in menus or</text><text x="64" y="627" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">the command palette.</text><text x="620" y="540" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A status line is a sentence, not a progress ornament. It names the object, the operation</text><text x="620" y="557" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">and the result, and it keeps the last useful value visible while a refresh is in flight.</text><text x="620" y="640" fill="#8A302F" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="12" font-weight="normal" text-anchor="start" font-style="italic">Spinners may accompany a sentence. They never replace one.</text>
</svg>

