<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Scene to output workstations</title>
  <desc id="desc">A central Lapidary scene connected to display, PDF, print, thumbnail, raster, clipboard, accessibility, hit-map and manifest outputs.</desc>
  <rect width="1200" height="780" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">One scene, every output</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">The scene is the contract. Display, paper and metadata are workstations that read it.</text><rect x="450" y="316" width="300" height="128" fill="#173F35" stroke="#17201C" stroke-width="2" rx="0"/><text x="600" y="360" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="13" font-weight="bold" text-anchor="middle" font-style="normal" letter-spacing="0.8">LAPIDARY SCENE</text><text x="600" y="384" fill="#A9B1AB" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">geometry · text · clipping</text><text x="600" y="404" fill="#A9B1AB" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">transforms · hit regions</text><text x="600" y="424" fill="#A9B1AB" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">physical units · intent</text><line x1="600" y1="380" x2="167.0" y2="232.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="167.0" y2="392.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="167.0" y2="552.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="433.0" y2="692.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="633.0" y2="692.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="833.0" y2="692.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="1033.0" y2="552.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="1033.0" y2="392.0" stroke="#AAA99F" stroke-width="1.2"/><line x1="600" y1="380" x2="1033.0" y2="232.0" stroke="#AAA99F" stroke-width="1.2"/><rect x="64" y="200" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="76" y="225" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Display</text><text x="76" y="244" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">interactive</text><rect x="64" y="360" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="76" y="385" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">PDF</text><text x="76" y="404" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">vector pages</text><rect x="64" y="520" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="76" y="545" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Print</text><text x="76" y="564" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">printer-bound</text><rect x="330" y="660" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="342" y="685" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Thumbnail</text><text x="342" y="704" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">small raster</text><rect x="530" y="660" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="542" y="685" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Raster</text><text x="542" y="704" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">PNG export</text><rect x="730" y="660" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="742" y="685" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Clipboard</text><text x="742" y="704" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">geometry + text</text><rect x="930" y="520" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="942" y="545" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Accessibility</text><text x="942" y="564" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">roles + names</text><rect x="930" y="360" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="942" y="385" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Hit map</text><text x="942" y="404" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">regions + ids</text><rect x="930" y="200" width="206" height="64" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="942" y="225" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Manifest</text><text x="942" y="244" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">export.json</text><text x="64" y="752" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Parity is measured: geometry, text placement, clipping and metadata, within declared tolerances. A target that cannot agree fails the build.</text>
</svg>

