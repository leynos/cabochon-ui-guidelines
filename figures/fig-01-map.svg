<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-01-map&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null, &quot;states&quot;: {}}</metadata>
  <title id="title">The two-plane Cabochon ecosystem map</title>
  <desc id="desc">An application above the GEM substrate of Clerestory, Escutcheon, Lapidary and Burin, and a semantic lower plane led by Enfilade, with Mullion deferred.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Two planes, one substrate</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">An application draws through the upper plane and reaches objects through the lower. It never reaches around either.</text><rect x="64" y="158" width="740" height="96" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="84" y="184" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">APPLICATION</text><text x="84" y="212" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="18" font-weight="normal" text-anchor="start" font-style="italic">Facet Notes</text><text x="84" y="236" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Uses the substrate; never reaches around it.</text><rect x="64" y="276" width="740" height="190" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="84" y="300" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">UPPER PLANE · GEM SUBSTRATE</text><rect x="86" y="316" width="332" height="62" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="98" y="340" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" font-style="normal">Clerestory</text><text x="98" y="360" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">windows · menus · commands · focus</text><rect x="438" y="316" width="332" height="62" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="450" y="340" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" font-style="normal">Escutcheon</text><text x="450" y="360" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">menus · strings · icons · shortcuts</text><rect x="86" y="388" width="332" height="62" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="98" y="412" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" font-style="normal">Lapidary</text><text x="98" y="432" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">rectangles · paths · text · images</text><rect x="438" y="388" width="332" height="62" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="450" y="412" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" font-style="normal">Burin</text><text x="450" y="432" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">display · PDF · raster · print · a11y</text><line x1="434" y1="466" x2="434" y2="506" stroke="#8A302F" stroke-width="2"/><path d="M 428 500 L 434 506 L 440 500" fill="none" stroke="#8A302F" stroke-width="2"/><text x="448" y="494" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">selectors · capabilities · transactions</text><rect x="64" y="506" width="740" height="170" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="84" y="530" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">LOWER PLANE · SEMANTIC</text><rect x="86" y="544" width="696" height="62" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="98" y="568" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" font-style="normal">Enfilade</text><text x="98" y="588" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">object identity · selectors · capabilities · transactions · live relationships</text><text x="98" y="632" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">runtime services: portals · storage · identity providers</text><rect x="830" y="158" width="306" height="150" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="850" y="184" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">DEFERRED SHELL</text><rect x="850" y="200" width="266" height="88" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0" stroke-dasharray="5 5"/><text x="864" y="226" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="14" font-weight="normal" text-anchor="start" font-style="italic">Mullion</text><text x="864" y="246" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">A future compositor and shell. It must not</text><text x="864" y="261" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">add a second object system or rendering path.</text><rect x="830" y="326" width="306" height="350" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="850" y="352" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">WHAT THE MAP IMPLIES</text><text x="850" y="388" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">01</text><text x="880" y="388" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Chrome is shared; content is specific.</text><text x="880" y="406" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Windows, menus, state chips and inspectors</text><text x="880" y="421" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">are environment furniture.</text><text x="850" y="480" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">02</text><text x="880" y="480" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Identity outlives presentation.</text><text x="880" y="498" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">One object, many presentations, one identity.</text><text x="850" y="572" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">03</text><text x="880" y="572" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Failure is a first-class surface.</text><text x="880" y="590" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Stale, broken and denied are interface</text><text x="880" y="605" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">states, not log lines.</text><text x="64" y="716" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">The substrate is production, even when the shell is deferred.</text>
</svg>

