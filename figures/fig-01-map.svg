<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">The book in eight parts</title>
  <desc id="desc">Eight part cards covering orientation, principles, foundations, the application frame, interaction, instruments, the object world and craft.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="72" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="120" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">The book in eight parts</text><text x="64" y="152" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A reading path from the idea to the checklist. Every part ends with the same question: does this help a person do the work?</text><rect x="64" y="166" width="250" height="220" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="80" y="196" fill="#8A302F" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="normal" text-anchor="start" font-style="italic">I</text><text x="80" y="226" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" font-style="normal">Orientation</text><text x="80" y="248" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.6">Chapters 1-4</text><line x1="80" y1="264" x2="298" y2="264" stroke="#AAA99F" stroke-width="1"/><text x="80" y="292" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">idea</text><text x="80" y="314" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal