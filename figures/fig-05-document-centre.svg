<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">One object, four presentations</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">The document is the stable thing. Presentation is how the same object appears for a task.</text><ellipse cx="600" cy="420" rx="76" ry="48" fill="#285E50" stroke="#173F35" stroke-width="2"/><text x="600" y="426" fill="#FFFFFF" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="15" font-weight="bold" text-anchor="middle" font-style="normal">OBJ</text><text x="600" y="498" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="middle" font-style="normal" letter-spacing="0.6">stable identity</text><rect x="64" y="166" width="240" height="170" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="76" y="188" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">NOTES</text><rect x="76" y="200" width="216" height="120" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="94" y="230" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="18" font-weight="normal" text-anchor="start" font-style="italic">North Sea transition</text><line x1="94" y1="244" x2="274"