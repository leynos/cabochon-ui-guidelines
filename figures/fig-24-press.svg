er-spacing="0.8">PREFLIGHT</text><text x="852" y="266" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" font-style="normal">✓</text><text x="874" y="266" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Fonts embedded</text><line x1="852" y1="280" x2="1120" y2="280" stroke="#AAA99F" stroke-width="0.5"/><text x="852" y="306" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" font-style="normal">✓</text><text x="874" y="306" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Images at 300 dpi</text><line x1="852" y1="320" x2="1120" y2="320" stroke="#AAA99F" stroke-width="0.5"/><text x="852" y="346" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" font-style="normal">✓</text><text x="874" y="346" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Colour intent PDF/X-4</text><line x1="852" y1="360" x2="1120" y2="360" stroke="#AAA99F" stroke-width="0.5"/><text x="852" y="386" fill="#285E50" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" font-style="normal">✓</text><text x="874" y="386" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Bleed 3 mm</text><line x1="852" y1="400" x2="1120" y2="400" stroke="#AAA99F" stroke-width="0.5"/><text x="852" y="426" fill="#8A5B24" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" font-style="normal">!</text><text x="874" y="426" fill="#8A5B24" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Live object will flatten</text><line x1="852" y1="440" x2="1120" y2="440" stroke="#AAA99F" stroke-width="0.5"/><text x="852" y="490" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A live object prints through its print</text><text x="852" y="507" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">presentation. Press reports the resolution and</text><text x="852" y="524" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">intent it will use, and never silently exports</text><text x="852" y="541" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">the screen view.</text><rect x="852" y="588" width="124" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="914.0" y="608.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Proof</text><rect x="988" y="588" width="132" height="32" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="1054.0" y="608.0" fill="#FF