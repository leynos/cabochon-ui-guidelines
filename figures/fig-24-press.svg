normal" text-anchor="start" font-style="normal">Plate</text><rect x="78" y="568" width="52" height="44" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="142" y="586" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">06</text><text x="142" y="602" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">Plate</text><line x1="214" y1="210" x2="214" y2="664" stroke="#17201C" stroke-width="1"/><rect x="288" y="246" width="430" height="384" fill="#17201C18" stroke-width="1" rx="0"/><rect x="274" y="232" width="430" height="384" fill="#FFFFFF" stroke="#17201C" stroke-width="1" rx="0"/><text x="306" y="294" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="26" font-weight="normal" text-anchor="start" font-style="italic">A currency for the</text><text x="306" y="326" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="26" font-weight="normal" text-anchor="start" font-style="italic">North Sea transition</text><line x1="306" y1="348" x2="672" y2="348" stroke="#17201C" stroke-width="1"/><text x="306" y="378" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A short brief for the first Cabochon currency object, with its</text><text x="306" y="394" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">sources and its print presentation.</text><rect x="306" y="452" width="366" height="120" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="320" y="478"