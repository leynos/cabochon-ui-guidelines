<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Cabochon Press with pages and preflight</title>
  <desc id="desc">A page-layout window with a pages panel, an A4 page with bleed and crop marks, and a preflight panel checking fonts, images, colour and bleed.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Cabochon Press</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A page is a surface with intent. Press shows the page, its pages panel and its preflight in one window.</text><rect x="72" y="158" width="1072" height="540" fill="#17201C20" stroke-width="1" rx="0"/><rect x="64" y="150" width="1072" height="540" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="150" width="1072" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="180.5" x2="1136" y2="180.5" stroke="#AAA99F" stroke-width="1"/><text x="76" y="170" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Cabochon Press — Currency brief</text><rect x="1066" y="159" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="1072" y="169" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">–</text><rect x="1088" y="159" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="1094" y="169" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">□</text><rect x=