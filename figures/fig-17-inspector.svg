<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Object inspector</title>
  <desc id="desc">An inspector panel listing identity, presentation, authority and state, with notes on what belongs and what does not.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">The inspector explains the object</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Identity, presentation, state and authority, in that order. The inspector describes; it does not become a second application.</text><rect x="70" y="166" width="420" height="580" fill="#17201C18" stroke-width="1" rx="0"/><rect x="64" y="160" width="420" height="580" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="160" width="420" height="28" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="187.5" x2="484" y2="187.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="178" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">INSPECTOR</text><text x="474" y="178" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">object</text><text x="80" y="212" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="18" font-weight="normal" text-anchor="start" font-style="italic">Generation mix</text><text x="80" y="232" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Table · obj:8f3a</text><rect x="374" y="198" width="65.74000000000001" height="20" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="384" cy="208" r="3" fill="#285E50" stroke-width="1"/><text x="392" y="212" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">CURRENT</text><text x="80" y="266" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.7">IDENTITY</text><text x="80" y="290" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.5">OBJECT</text><text x="468" y="290" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">obj:8f3a</text><line x1="80" y1="298" x2="468" y2="298" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="314" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.5">PROVIDER</text><text x="468" y="314" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">enfilade.table</text><line x1="80" y1="322" x2="468" y2="322" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="338" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.5">REVISION</text><text x="468" y="338" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">r17</text><line x1="80" y1="346" x2="468" y2="346" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="362" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal" letter-spacing="0.5">PARENT</text><text x="468" y="362" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">note:transition</text><line x1="80" y1="370" x2="468" y2="370" stroke="#AAA99F" stroke-width="0.5"/><text x="80" y="398" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.7">PRESENTATION</text><circle cx="88" cy="417" r="8" fill="#FFFFFF" stroke="#17201C" stroke-width="1"/><circle cx="88" cy="417" r="4" fill="#285E50" stroke-width="1"/><text x="104" y="422" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">In note</text><text x="190" y="422" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">12 rows · 4 columns</text><circle cx="88" cy="451" r="8" fill="#FFFFFF" stroke="#17201C" stroke-width="1"/><text x="104" y="456" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Dataframe</text><text x="190" y="456" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">focused editor</text><circle cx="88" cy="485" r="8" fill="#FFFFFF" stroke="#17201C" stroke-width="1"/><text x="104" y="490" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Print</text><text x="190" y="490" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">facing page</text><text x="80" y="516" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.7">STATE</text><rect x="80" y="528" width="65.74000000000001" height="20" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="90" cy="538" r="3" fill="#285E50" stroke-width="1"/><text x="98" y="542" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">CURRENT</text><text x="80" y="566" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Last refresh</text><text x="468" y="566" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">14:02</text><line x1="80" y1="584" x2="468" y2="584" stroke="#AAA99F" stroke-width="1"/><text x="80" y="604" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.7">AUTHORITY</text><text x="80" y="628" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Read</text><text x="468" y="628" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">granted</text><text x="80" y="650" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Write</text><text x="468" y="650" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">granted</text><text x="80" y="672" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Share</text><text x="468" y="672" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">denied</text><line x1="80" y1="690" x2="468" y2="690" stroke="#AAA99F" stroke-width="1"/><text x="80" y="712" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The last value is kept while the source is refreshed.</text><text x="540" y="190" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">WHAT BELONGS</text><text x="540" y="222" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Stable identity and revision.</text><text x="540" y="250" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Every presentation of the object.</text><text x="540" y="278" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The state of each live relationship.</text><text x="540" y="306" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The grants that allow an action.</text><text x="540" y="334" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">The provider that owns the data.</text><text x="540" y="402" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">WHAT DOES NOT</text><text x="540" y="434" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A second copy of the document.</text><text x="540" y="462" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Raw provider diagnostics as primary text.</text><text x="540" y="490" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A place to edit every property at once.</text><text x="540" y="518" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A marketing surface for unused features.</text><line x1="540" y1="580" x2="1136" y2="580" stroke="#AAA99F" stroke-width="1"/><text x="540" y="606" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">The inspector is read-mostly by default. Editing a property happens in the document or in the</text><text x="540" y="625" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">focused editor, through a transaction. The inspector may offer the same command, but it does</text><text x="540" y="644" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">not invent a parallel editing model.</text>
</svg>

