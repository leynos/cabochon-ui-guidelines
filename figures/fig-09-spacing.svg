  <title id="title">Spacing scale and measured tool strip</title>
  <desc id="desc">Eight spacing steps and an annotated toolbar with target and padding measurements.</desc>
  <rect width="1200" height="720" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Spacing, density and targets</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A four-pixel grid, eight steps, and a floor under every pointer target.</text><text x="64" y="180" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">4</text><rect x="80" y="166" width="12" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="104" y="182" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">4 px</text><text x="64" y="238" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">8</text><rect x="80" y="224" width="24" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="116" y="240" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">8 px</text><text x="64" y="296" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">12</text><rect x="80" y="282" width="36" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="128" y="298" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">12 px</text><text x="64" y="354" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">16</text><rect x="80" y="340" width="48" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="140" y="356" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">16 px</text><text x="64" y="412" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">24</text><rect x="80" y="398" width="72" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="164" y="414" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">24 px</text><text x="64" y="470" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">32</text><rect x="80" y="456" width="96" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="188" y="472" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">32 px</text><text x="64" y="528" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">48</text><rect x="80" y="514" width="144" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="236" y="530" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">48 px</text><text x="64" y="586" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">64</text><rect x="80" y="572" width="192" height="22" fill="#285E50" stroke-width="1" rx="0"/><text x="284" y="588" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">64 px</text><text x="64" y="660" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Use 4/8/12/16 for in-pane rhythm; 24/32/48/64 for structure.</text><rect x="600" y="166" width="536" height="390" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="620" y="196" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">A measured tool strip</text><rect x="620" y="224" width="496" height="58" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="636" y="238" width="30" height="30" fill="#FFFFFF" stroke="#17201C" stroke-width="2" rx="0"/><text x="651" y="258" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">↖</text><rect x="674" y="238" width="30" height="30" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="689" y="258" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" font-style="normal">T</text><rect x="712" y="238" width="30" height="30" fill="#FFFFFF" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="727" y="258" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" font-style="normal">□</text><text x="760" y="258" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Body · 10.5 pt · 14 pt</text><rect x="1000" y="238" width="100" height="30" fill="#E7F0ED" stroke="#285E50" stroke-width="1" rx="0"/><text x="1010" y="258" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">3 tools</text><line x1="636" y1="300" x2="666" y2="300" stroke="#8A302F" stroke-width="1"/><line x1="636" y1="294" x2="636" y2="306" stroke="#8A302F" stroke-width="1"/><line x1="666" y1="294" x2="666" y2="306" stroke="#8A302F" stroke-width="1"/><text x="651" y="320" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">30</text><line x1="666" y1="336" x2="674" y2="336" stroke="#8A302F" stroke-width="1"/><text x="670" y="352" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">8</text><line x1="620" y1="366" x2="1116" y2="366" stroke="#8A302F" stroke-width="1" stroke-dasharray="3 3"/><text x="620" y="386" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">16 px pane padding</text><text x="620" y="432" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Minimum target 28 x 28. Preferred 32 x 32.</text><text x="620" y="452" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Primary action 36 high; dialog buttons 32 high.</text><text x="620" y="472" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Hit slop may extend 4 px beyond a drawn glyph.</text><text x="600" y="600" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">Density is a property of the pane, not an excuse to shrink the hit target.</text>
</svg>

