<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="title desc">
  <title id="title">Four interface planes</title>
  <desc id="desc">Paper, pane, control and overlay planes, each with a border and only the overlay with an offset shadow.</desc>
  <rect width="1200" height="740" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Planes, borders and elevation</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">The interface is made of flat planes with exact edges. Depth is a border and an offset, not a glow.</text><rect x="232" y="214" width="420" height="210" fill="#17201C18" stroke-width="1" rx="0"/><rect x="220" y="200" width="420" height="210" fill="#F1EEE5" stroke="#17201C" stroke-width="1" rx="0"/><text x="236" y="228" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">PAPER</text><text x="236" y="252" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">the document ground</text><rect x="352" y="284" width="420" height="210" fill="#17201C18" stroke-width="1" rx="0"/><rect x="340" y="270" width="420" height="210" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="356" y="298" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">PANE</text><text x="356" y="322" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">a region of work</text><rect x="472" y="354" width="420" height="210" fill="#17201C18" stroke-width="1" rx="0"/><rect x="460" y="340" width="420" height="210" fill="#E4E3DD" stroke="#17201C" stroke-width="1" rx="0"/><text x="476" y="368" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">CONTROL</text><text x="476" y="392" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">a thing you can press</text><rect x="592" y="424" width="420" height="210" fill="#17201C18" stroke-width="1" rx="0"/><rect x="580" y="410" width="420" height="210" fill="#FAF8F2" stroke="#17201C" stroke-width="1.5" rx="0"/><text x="596" y="438" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="0.8">OVERLAY</text><text x="596" y="462" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">a thing that must be seen</text><text x="780" y="242" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">1 px border</text><line x1="720" y1="254" x2="880" y2="254" stroke="#AAA99F" stroke-width="1"/><text x="780" y="284" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">No blur</text><text x="780" y="326" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Offset shadow only for overlays</text><text x="780" y="368" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Never raise a control with a glow</text><text x="64" y="690" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">A border says where a thing ends. An offset says that it floats. Nothing else needs to be said.</text>
</svg>

