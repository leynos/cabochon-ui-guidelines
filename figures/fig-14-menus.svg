<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-figure-class="schematic" data-figure-profile="substrate" aria-labelledby="title desc">
  <metadata>{&quot;class&quot;: &quot;schematic&quot;, &quot;components&quot;: [], &quot;name&quot;: &quot;fig-14-menus&quot;, &quot;profile&quot;: &quot;substrate&quot;, &quot;scale&quot;: null}</metadata>
  <title id="title">A menu bar with an open File menu</title>
  <desc id="desc">A File menu showing commands, shortcuts, a disabled item and separators, with rules for naming and availability.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Menus name commands</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A menu is a list of verbs. It is not a catalogue of everything the application can do.</text><rect x="72" y="168" width="700" height="450" fill="#17201C20" stroke-width="1" rx="0"/><rect x="64" y="160" width="700" height="450" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="160" width="700" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="190.5" x2="764" y2="190.5" stroke="#AAA99F" stroke-width="1"/><text x="76" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Facet Notes — North Sea transition</text><text x="674" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">–</text><text x="710" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">□</text><text x="746" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">×</text><rect x="64" y="191" width="700" height="29" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="219.5" x2="764" y2="219.5" stroke="#AAA99F" stroke-width="1"/><rect x="69" y="194" width="48" height="23" fill="#285E50" stroke-width="1" rx="0"/><text x="79" y="210" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">File</text><text x="127" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Edit</text><text x="175" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">View</text><text x="223" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Object</text><text x="285" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Tools</text><text x="340" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Window</text><text x="402" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Help</text><line x1="64" y1="220" x2="764" y2="220" stroke="#AAA99F" stroke-width="1"/><rect x="64" y="584" width="700" height="26" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="584.5" x2="764" y2="584.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="601" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">North Sea transition · saved 14:02</text><rect x="76" y="224" width="300" height="352" fill="#17201C18" stroke-width="1" rx="0"/><rect x="72" y="220" width="300" height="352" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="90" y="246" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">New note</text><text x="354" y="246" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+N</text><text x="90" y="274" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">New from template…</text><text x="90" y="302" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Open…</text><text x="354" y="302" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+O</text><line x1="82" y1="326" x2="362" y2="326" stroke="#AAA99F" stroke-width="1"/><text x="90" y="358" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Save</text><text x="354" y="358" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+S</text><text x="90" y="386" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Save as…</text><text x="354" y="386" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+Shift+S</text><text x="90" y="414" fill="#AAA99F" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Revert to saved</text><line x1="82" y1="438" x2="362" y2="438" stroke="#AAA99F" stroke-width="1"/><text x="90" y="470" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Export</text><text x="354" y="470" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">▸</text><line x1="82" y1="494" x2="362" y2="494" stroke="#AAA99F" stroke-width="1"/><text x="90" y="526" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Close</text><text x="354" y="526" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+W</text><text x="90" y="554" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Quit</text><text x="354" y="554" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">Ctrl+Q</text><rect x="78" y="340" width="288" height="28" fill="#285E50" stroke-width="1" rx="0" opacity="0.12"/><text x="820" y="190" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">RULES</text><text x="820" y="222" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Name commands with verbs.</text><text x="820" y="250" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Show the shortcut beside the item.</text><text x="820" y="278" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Disable a command that is unavailable for now.</text><text x="820" y="306" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Omit one that can never apply to the object.</text><text x="820" y="334" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Every menu command is also searchable.</text><text x="820" y="362" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Quit is always Ctrl+Q.</text><line x1="820" y1="414" x2="1136" y2="414" stroke="#AAA99F" stroke-width="1"/><text x="820" y="440" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Submenus collect variations of one verb. They do not</text><text x="820" y="457" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">bury unrelated features. A submenu that exists only to</text><text x="820" y="474" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">shorten a long menu should be removed.</text><text x="820" y="522" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Menu bars stay visible. When the window is narrow,</text><text x="820" y="539" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">whole menus move into More; commands do not become a</text><text x="820" y="556" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">hamburger.</text>
</svg>

