rif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">hairline</text><text x="64" y="500" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">DARK</text><rect x="64" y="522" width="144" height="96" fill="#121816" stroke="#17201C" stroke-width="1" rx="0"/><text x="74" y="546" fill="#EDE9DE" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Ground</text><text x="74" y="566" fill="#EDE9DE" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">#121816</text><rect x="222" y="522" width="144" height="96" fill="#1B2420" stroke="#17201C" stroke-width="1" rx="0"/><text x="232" y="546" fill="#EDE9DE" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Surface</text><text x="232" y="566" fill="#EDE9DE" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">#1B2420</text><rect x="380" y="522" width="144" height="96" fill="#EDE9DE" stroke="#17201C" stroke-width="1" rx="0"/><text x="390" y="546" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Text</text><text x="390" y="566" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">#EDE9DE</text><rect x="538" y="522" width="144" height="96" fill="#A9B1AB" stroke="#17201C" stroke-width="1" rx="0"/><text x="548" y="546" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Muted</text><text x="548" y="566" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">#A9B1AB</text><rect x="696" y="522" width="144" height="96" fill="#7FB3A3" stroke="#17201C" stroke-width="1" rx="0"/><text x="706" y="546" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Pine</text><text x="706" y="566" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">#7FB3A3</text><rect x="854" y="522" width="144" height="96" fill="#D98C86" stroke="#17201C" stroke-width="1" rx="0"/><text x="864" y="546" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Oxide</text><text x="864" y="566" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">#D98C86</text><rect x="1012" y="522" width="144" height="96" fill="#E0B36A" stroke="#17201C" stroke-width="1" rx="0"/><text x="1022" y="546" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">Amber</text><text x="1022" y="566" fill="#121816" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="start" font-style="normal">#E0B36A</text><text x="64" y="664" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Amber #B8792E is a large-text and icon accent; use #8A5B24 for body-size text.</text><text x="64" y="682" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Teal #678E86 is decoration and refresh motion, never body text on paper.</text><text x="64" y="700" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Line #AAA99F is a hairline, not a text colour.</text>
</svg>

