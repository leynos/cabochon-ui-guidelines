<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">The first batch in three bands</title>
  <desc id="desc">Three bands labelled now, next and later, listing contracts, workspace tools and studio instruments.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">The first batch</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Ship the contracts, then the workspace, then the studio. A tool may be deferred; the interface rules are not.</text><text x="64" y="188" fill="#173F35" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.2">NOW</text><text x="64" y="218" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="24" font-weight="normal" text-anchor="start" font-style="italic">Contracts</text><line x1="64" y1="234" x2="1136" y2="234" stroke="#AAA99F" stroke-width="1"/><rect x="300" y="174" width="192" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="310" y="196" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">hello-window</text><rect x="508" y="174" width="192" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="518" y="196" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">escutcheon-check</text><rect x="716" y="174" width="192" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="726" y="196" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Lapidary scene</text><rect x="924" y="174" width="192" height="34" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="934" y="196" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Burin output</text><text x="1136" y="192" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">shipped</text><text x="64" y="366" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.2">NEXT</text><text x="64" y="396" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="24" font-weight="normal" text-anchor="start" font-style="italic">Workspace</text><line x1="64" y1="412" x2="1136" y2="412" stroke="#AAA99F" stroke-width="1"/><rect x="300" y="352" width="192" height="34" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><text x="310" y="374" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Facet Notes</text><rect x="508" y="352" width="192" height="34" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><text x="518" y="374" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">dataframe</text><rect x="716" y="352" width="192" height="34" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><text x="726" y="374" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">diagram</text><rect x="924" y="352" width="192" height="34" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><text x="934" y="374" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">bitmap</text><rect x="300" y="398" width="192" height="34" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><text x="310" y="420" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">formula</text><rect x="508" y="398" width="192" height="34" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><text x="518" y="420" fill="#17201C" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">inspector</text><text x="1136" y="370" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">in progress</text><text x="64" y="544" fill="#456A62" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.2">LATER</text><text x="64" y="574" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="24" font-weight="normal" text-anchor="start" font-style="italic">Studio</text><line x1="64" y1="590" x2="1136" y2="590" stroke="#AAA99F" stroke-width="1"/><rect x="300" y="530" width="192" height="34" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="310" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Burin Draw</text><rect x="508" y="530" width="192" height="34" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="518" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Cabochon Press</text><rect x="716" y="530" width="192" height="34" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="726" y="552" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Enfilade Table</text><text x="1136" y="548" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">held to the same rules</text><text x="64" y="716" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">A deferred tool is not a different design language.</text>
</svg>

