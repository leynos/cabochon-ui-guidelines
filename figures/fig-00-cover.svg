  <title id="title">Cover plate: a polished cabochon surrounded by four instruments</title>
  <desc id="desc">A green cabochon stone on a warm paper ground, with Facet Notes, Enfilade Table, Burin Draw and Cabochon Press named around it.</desc>
  <rect width="1200" height="800" fill="#F1EEE5"/>
