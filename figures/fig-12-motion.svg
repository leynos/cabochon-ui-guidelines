<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Motion timing chart</title>
  <desc id="desc">Ease-out curves for 80, 140 and 180 millisecond transitions, with rules for restrained motion.</desc>
  <rect width="1200" height="720" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Motion with a reason</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Motion explains a change of state. It does not perform.</text><line x1="150" y1="560" x2="910" y2="560" stroke="#17201C" stroke-width="1"/><line x1="150" y1="560" x2="150" y2="200" stroke="#17201C" stroke-width="1"/><line x1="150.0" y1="560" x2="150.0" y2="566" stroke="#17201C" stroke-width="1"/><text x="150.0" y="584" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">0</text><line x1="340.0" y1="560" x2="340.0" y2="566" stroke="#17201C" stroke-width="1"/><text x="340.0" y="584" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">55</text><line x1="530.0" y1="560" x2="530.0" y2="566" stroke="#17201C" stroke-width="1"/><text x="530.0" y="584" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">110</text><line x1="720.0" y1="560" x2="720.0" y2="566" stroke="#17201C" stroke-width="1"/><text x="720.0" y="584" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">165</text><line x1="910.0" y1="560" x2="910.0" y2="566" stroke="#17201C" stroke-width="1"/><text x="910.0" y="584" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="middle" font-style="normal">220</text><text x="530.0" y="610" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">milliseconds</text><text x="134" y="200" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="end" font-style="normal">1</text><text x="134" y="560" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="9" font-weight="normal" text-anchor="end" font-style="normal">0</text><path d="M 150 560 C 205.27272727272728 362.0, 302.0 228.8, 426.3636363636364 200" fill="none" stroke="#285E50" stroke-width="2.5"/><circle cx="426.3636363636364" cy="200" r="5" fill="#285E50" stroke-width="1"/><text x="436.3636363636364" y="204" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">80 ms</text><path d="M 150 560 C 246.72727272727275 362.0, 416.0 228.8, 633.6363636363636 200" fill="none" stroke="#678E86" stroke-width="2.5"/><circle cx="633.6363636363636" cy="200" r="5" fill="#678E86" stroke-width="1"/><text x="643.6363636363636" y="204" fill="#678E86" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">140 ms</text><path d="M 150 560 C 274.3636363636364 362.0, 492.00000000000006 228.8, 771.8181818181819 200" fill="none" stroke="#8A302F" stroke-width="2.5"/><circle cx="771.8181818181819" cy="200" r="5" fill="#8A302F" stroke-width="1"/><text x="781.8181818181819" y="204" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">180 ms</text><text x="190" y="176" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">progress</text><rect x="940" y="166" width="196" height="250" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="956" y="194" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">RULES</text><text x="956" y="224" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Ease out, never bounce.</text><text x="956" y="258" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">No parallax.</text><text x="956" y="292" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">No animation for its own sake.</text><text x="956" y="326" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Reduced motion: 0.01 ms.</text><text x="64" y="690" fill="#59625D" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="13" font-weight="normal" text-anchor="start" font-style="italic">If a change cannot be explained in one sentence, it does not need a transition.</text>
</svg>

