<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Pseudo-localized left-to-right and right-to-left windows</title>
  <desc id="desc">Two windows showing expanded en-XA text and mirrored ar-XB layout, with notes on what the pseudo-locales test.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Language is not a later coat of paint</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">Pseudo-locales expose hard-coded widths, concatenated strings and left-to-right assumptions before translation begins.</text><text x="64" y="150" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">EN-XA · +35% MINIMUM</text><rect x="72" y="168" width="480" height="340" fill="#17201C20" stroke-width="1" rx="0"/><rect x="64" y="160" width="480" height="340" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="64" y="160" width="480" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="190.5" x2="544" y2="190.5" stroke="#AAA99F" stroke-width="1"/><text x="76" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Facet Notes — ⟦Ŵöŕļď ťŕáńšîťîöń ··⟧</text><text x="454" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">–</text><text x="490" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">□</text><text x="526" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">×</text><rect x="64" y="191" width="480" height="29" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="219.5" x2="544" y2="219.5" stroke="#AAA99F" stroke-width="1"/><text x="79" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">⟦Fîļé⟧</text><text x="141" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">⟦Édîť⟧</text><text x="203" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">⟦Vîéŵ⟧</text><text x="265" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">⟦Héļþ⟧</text><line x1="64" y1="220" x2="544" y2="220" stroke="#AAA99F" stroke-width="1"/><rect x="64" y="474" width="480" height="26" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="64" y1="474.5" x2="544" y2="474.5" stroke="#AAA99F" stroke-width="1"/><text x="74" y="491" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">⟦Ŝávéď · 3 émбédš ····⟧</text><rect x="424" y="475" width="65.74000000000001" height="20" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="434" cy="485" r="3" fill="#285E50" stroke-width="1"/><text x="442" y="489" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">CURRENT</text><text x="86" y="256" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="20" font-weight="normal" text-anchor="start" font-style="italic">⟦Ťŕáńšîťîöń þáťĥŵáýš ···⟧</text><text x="86" y="284" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">⟦Ťĥé ťŕáńšîťîöń îš ńöť öńé déçîšîöń бůť á šéqůéńçé öf šмáļļ öńéš. ······⟧</text><rect x="86" y="376" width="190" height="36" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="181.0" y="398.0" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">⟦Éхþöŕť áš PDF ·⟧</text><rect x="288" y="378" width="130" height="32" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="353.0" y="398.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">⟦Çáńçéļ ·⟧</text><text x="86" y="452" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Controls grow; labels do not clip.</text><text x="656" y="150" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">AR-XB · MIRRORED</text><rect x="664" y="168" width="480" height="340" fill="#17201C20" stroke-width="1" rx="0"/><rect x="656" y="160" width="480" height="340" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="656" y="160" width="480" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="656" y1="190.5" x2="1136" y2="190.5" stroke="#AAA99F" stroke-width="1"/><text x="1024" y="180" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" font-style="normal">مفكرة الأوجه — انتقال بحر الشمال</text><text x="674" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">–</text><text x="710" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">□</text><text x="746" y="182" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal">×</text><rect x="656" y="191" width="480" height="29" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="656" y1="219.5" x2="1136" y2="219.5" stroke="#AAA99F" stroke-width="1"/><text x="1116" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" font-style="normal">ملف</text><text x="1075" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" font-style="normal">تحرير</text><text x="1020" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" font-style="normal">عرض</text><text x="979" y="210" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" font-style="normal">مساعدة</text><line x1="656" y1="220" x2="1136" y2="220" stroke="#AAA99F" stroke-width="1"/><rect x="656" y="474" width="480" height="26" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="656" y1="474.5" x2="1136" y2="474.5" stroke="#AAA99F" stroke-width="1"/><text x="1126" y="491" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">محفوظ · ٣ كائنات</text><rect x="666" y="475" width="65.74000000000001" height="20" fill="#FAF8F2" stroke="#285E50" stroke-width="1" rx="0"/><circle cx="676" cy="485" r="3" fill="#285E50" stroke-width="1"/><text x="684" y="489" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="bold" text-anchor="start" font-style="normal">CURRENT</text><text x="1114" y="256" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="20" font-weight="normal" text-anchor="end" font-style="italic">انتقال بحر الشمال</text><text x="1114" y="284" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">الانتقال ليس قراراً واحداً بل سلسلة من القرارات الصغيرة. يبقى كل مصدر قابلاً</text><text x="1114" y="301" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" font-style="normal">للتحرير، ويحتفظ كل كائن بهويته.</text><rect x="954" y="374" width="160" height="38" fill="#173F35" stroke="#173F35" stroke-width="1" rx="0"/><text x="1034.0" y="397.0" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">تصدير PDF</text><rect x="812" y="374" width="130" height="38" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="877.0" y="397.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">إلغاء</text><text x="1114" y="444" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="end" font-style="normal">تنتقل الواجهة كاملة إلى اليمين.</text><text x="64" y="552" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1">WHAT THE PSEUDO-LOCALES CATCH</text><text x="64" y="582" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">EN-XA</text><text x="64" y="602" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Expanded accents reveal clipped labels and</text><text x="64" y="618" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">fixed-width buttons.</text><text x="334" y="582" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">AR-XB</text><text x="334" y="602" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Mirrored layout reveals panes, icons and</text><text x="334" y="618" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">reading order that assume left-to-right.</text><text x="604" y="582" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">NUMBERS</text><text x="604" y="602" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Digits, dates and currency are formatted by</text><text x="604" y="618" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">locale, never assembled from strings.</text><text x="874" y="582" fill="#285E50" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal">STRINGS</text><text x="874" y="602" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Full sentences are resources. Fragments are</text><text x="874" y="618" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">not concatenated.</text><text x="64" y="704" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">A localized build is a gate, not a screenshot. The pseudo-locales run in the same export bundle as the default language.</text>
</svg>

