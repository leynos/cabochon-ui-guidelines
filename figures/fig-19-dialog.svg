<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Destructive confirmation dialog</title>
  <desc id="desc">A modal dialog asking whether to replace an embedded table, with object identity, a keep-a-copy choice and a destructive Replace button.</desc>
  <rect width="1200" height="760" fill="#F1EEE5"/>
<text x="64" y="70" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="bold" text-anchor="start" font-style="normal" letter-spacing="1.1">CABOCHON INTERFACE GUIDELINES</text><text x="64" y="118" fill="#17201C" font-family="Georgia, &#x27;DejaVu Serif&#x27;, &#x27;Times New Roman&#x27;, serif" font-size="34" font-weight="normal" text-anchor="start" font-style="italic">Dialogs interrupt with a reason</text><text x="64" y="150" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" font-style="normal">A dialog asks one question, names the object and offers a way out. It is not a place to arrange the application.</text><rect x="64" y="150" width="1072" height="540" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><rect x="64" y="150" width="1072" height="540" fill="#17201C" stroke-width="1" rx="0" opacity="0.18"/><text x="90" y="184" fill="#FFFFFF" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">Document (inert while the dialog is open)</text><rect x="338" y="218" width="540" height="340" fill="#17201C30" stroke-width="1" rx="0"/><rect x="330" y="210" width="540" height="340" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><rect x="330" y="210" width="540" height="31" fill="#F1EEE5" stroke-width="1" rx="0"/><line x1="330" y1="240.5" x2="870" y2="240.5" stroke="#AAA99F" stroke-width="1"/><text x="342" y="230" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Replace the embedded table?</text><rect x="800" y="219" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="806" y="229" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">–</text><rect x="822" y="219" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="828" y="229" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">□</text><rect x="844" y="219" width="12" height="12" fill="#FAF8F2" stroke="#17201C" stroke-width="1" rx="0"/><text x="850" y="229" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" font-style="normal">×</text><text x="354" y="272" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">The note currently embeds “Generation mix” as a live table. Replacing it will</text><text x="354" y="291" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">remove the embed, not delete the table object.</text><rect x="354" y="340" width="492" height="52" fill="#F1EEE5" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="368" y="362" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" font-style="normal">Generation mix</text><text x="368" y="380" fill="#59625D" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">Table · r17 · obj:8f3a</text><rect x="354" y="411" width="16" height="16" fill="#FFFFFF" stroke="#17201C" stroke-width="1" rx="0"/><text x="378" y="424" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" font-style="normal">Keep a copy in this note</text><text x="354" y="454" fill="#8A302F" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">This cannot be undone after the note is saved.</text><rect x="570" y="486" width="120" height="36" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="630.0" y="508.0" fill="#17201C" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Cancel</text><rect x="706" y="486" width="140" height="36" fill="#FAF8F2" stroke="#AAA99F" stroke-width="1" rx="0"/><text x="776.0" y="508.0" fill="#8A302F" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" font-style="normal">Replace</text><rect x="564" y="480" width="132" height="48" fill="none" stroke="#8A302F" stroke-width="3" rx="0"/><text x="570" y="468" fill="#8A302F" font-family="&#x27;DejaVu Sans Mono&#x27;, &#x27;Liberation Mono&#x27;, monospace" font-size="10" font-weight="normal" text-anchor="start" font-style="normal">default focus</text><text x="64" y="726" fill="#59625D" font-family="&#x27;DejaVu Sans&#x27;, &#x27;Liberation Sans&#x27;, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" font-style="normal">One question per dialog. The destructive verb names the object. Cancel is the default for destruction. Esc cancels. No dialog opens another dialog.</text>
</svg>

